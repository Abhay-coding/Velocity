[package]
name = "velocity-ui"
version = "0.1.0"
edition = "2021"

[features]
everything = ["dep:velocity-everything"]
desktop-acceptance = []

[dependencies]
velocity-core = { path = "../velocity-core" }
velocity-everything = { path = "../velocity-everything", optional = true }
velocity-native = { path = "../velocity-native" }
slint = { workspace = true, features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tray-icon = { version = "0.11" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = { workspace = true }
