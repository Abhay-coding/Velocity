[package]
name = "velocity-ui"
version = "0.1.0"
edition = "2021"

[features]
everything = ["dep:velocity-everything"]
desktop-acceptance = []

[dependencies]
velocity-core = { path = "../velocity-core" }
velocity-everything = { path = "../velocity-everything", optional = true }
velocity-native = { path = "../velocity-native" }
slint = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
rdev = "0.5"
tray-icon = { version = "0.11" }

[build-dependencies]
slint-build = { workspace = true }
