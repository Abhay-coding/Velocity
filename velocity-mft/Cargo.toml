[package]
name = "velocity-mft"
version = "0.1.0"
edition = "2021"


[dependencies]
velocity-core = { path = "../velocity-core" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemServices",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
