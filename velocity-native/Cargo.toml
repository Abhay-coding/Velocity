[package]
name = "velocity-native"
version = "0.1.0"
edition = "2021"

[dependencies]
velocity-core = { path = "../velocity-core" }
tokio.workspace = true
tracing.workspace = true
glob.workspace = true
memchr = "2"

[target.'cfg(windows)'.dependencies]
crc32fast = "1"
serde.workspace = true
serde_json.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true
